<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153a35">
  <meta name="description" content="الموقع العلمي للشيخ الدكتور مالك بن رضا المحمدي">
  <title>الشيخ د. مالك بن رضا المحمدي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "Tajawal", sans-serif;
      color: #203b35;
      background: #f5f3ed;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(ellipse at 50% 0, rgb(208 192 145 / 25%), transparent 58%),
        #f5f3ed;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(30px, 7vw, 64px);
      text-align: center;
      background: #fffefa;
      border: 1px solid #e8e1d0;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgb(34 54 46 / 10%);
    }

    .logo {
      width: 104px;
      height: 104px;
      object-fit: cover;
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #e8e1d0, 0 8px 24px rgb(34 54 46 / 12%);
    }

    .eyebrow {
      margin: 24px 0 8px;
      color: #a17b36;
      font-size: .9rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      color: #153a35;
      font-family: "Aref Ruqaa", "Noto Naskh Arabic", serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.5;
    }

    .calligraphy {
      display: block;
      width: min(100%, 430px);
      max-height: 130px;
      object-fit: contain;
      margin: 22px auto 10px;
    }

    .description {
      max-width: 500px;
      margin: 20px auto 0;
      color: #53645d;
      font-family: "Noto Naskh Arabic", serif;
      font-size: 1.15rem;
      line-height: 2;
    }

    .notice {
      margin: 30px 0 0;
      padding: 16px 18px;
      color: #5e512e;
      background: #f7f1df;
      border: 1px solid #eadfbe;
      border-radius: 14px;
      font-size: .95rem;
      line-height: 1.9;
    }

    footer {
      margin-top: 26px;
      color: #89918b;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="img/malik-logo.jpg" alt="شعار موقع الشيخ">
    <p class="eyebrow">الموقع العلمي</p>
    <h1>الشيخ د. مالك بن رضا المحمدي</h1>
    <img class="calligraphy" src="img/footer-calligraphy-from-user.png" alt="فضيلة الشيخ الدكتور">
    <p class="description">برامج ودروس وفوائد علمية للشيخ الدكتور مالك المحمدي، وفَّقه الله.</p>
    <p class="notice">هذه نسخة عرض ثابتة على GitHub Pages. المحتوى المباشر، وتسجيل الدخول، ولوحة التحكم تحتاج إلى تشغيل خادم الموقع وقاعدة البيانات، لذلك لا تتوفر في هذه النسخة.</p>
    <footer>نسخة معاينة للموقع العلمي</footer>
  </main>
</body>
</html>
